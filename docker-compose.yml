name: qnap-monitoring

x-qnap-image: &qnap-image
  image: ${DOCKERHUB_NAMESPACE:-ydxian}/qnap-monitor-one:${IMAGE_TAG:-latest}
  restart: unless-stopped
  user: "0:0"
  env_file:
    - ${QNAP_PROJECT_ROOT:-/share/Container/qnap-monitoring}/.env
  networks:
    - monitoring

services:
  grafana-postgres:
    image: postgres:16-alpine
    container_name: qnap-monitoring-postgres
    restart: unless-stopped
    env_file:
      - ${QNAP_PROJECT_ROOT:-/share/Container/qnap-monitoring}/.env
    volumes:
      - ${QNAP_DATA_ROOT:-/share/Container/qnap-monitoring}/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - monitoring

  qnap-exporter:
    <<: *qnap-image
    container_name: qnap-exporter
    entrypoint:
      - telegraf
      - --config
      - /opt/qnap/config/qnap-snmp.conf
    ports:
      - "${QNAP_EXPORTER_PORT:-39273}:9273"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:9273/metrics >/dev/null
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  qnap-host-exporter:
    <<: *qnap-image
    container_name: qnap-host-exporter
    entrypoint:
      - /bin/sh
      - /opt/qnap/scripts/qnap-host-entrypoint.sh
    volumes:
      - type: bind
        source: /share
        target: /share
        read_only: true
      - type: bind
        source: /proc
        target: /host-proc
        read_only: true
      - type: bind
        source: /sys
        target: /host-sys
        read_only: true
      - type: bind
        source: /etc/config
        target: /host-etc-config
        read_only: true
      - ${QNAP_DATA_ROOT:-/share/Container/qnap-monitoring}/host-cache:/var/cache/qnap-monitoring
    ports:
      - "${QNAP_HOST_EXPORTER_PORT:-39274}:9274"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:9274/metrics >/dev/null
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  qnap-pcie-exporter:
    <<: *qnap-image
    container_name: qnap-pcie-exporter
    privileged: true
    entrypoint:
      - telegraf
      - --config
      - /opt/qnap/config/qnap-pcie.conf
    volumes:
      - type: bind
        source: /sys
        target: /host-sys
        read_only: true
      - type: bind
        source: /proc
        target: /host-proc
        read_only: true
      - type: bind
        source: /etc/config
        target: /host-etc-config
        read_only: true
      - type: bind
        source: /share
        target: /share
        read_only: true
      - ${QNAP_DATA_ROOT:-/share/Container/qnap-monitoring}/pcie-cache:/var/cache/qnap-pcie
    ports:
      - "${QNAP_PCIE_EXPORTER_PORT:-39275}:9275"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:9275/metrics >/dev/null
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  qnap-process-exporter:
    <<: *qnap-image
    container_name: qnap-process-exporter
    entrypoint:
      - python3
      - /opt/qnap/scripts/qnap-process-exporter.py
    volumes:
      - type: bind
        source: /proc
        target: /host-proc
        read_only: true
      - type: bind
        source: /etc/config
        target: /host-etc-config
        read_only: true
    ports:
      - "${QNAP_PROCESS_EXPORTER_PORT:-39276}:9276"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:9276/metrics', timeout=3).read()
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.13.0
    container_name: qnap-prometheus
    restart: unless-stopped
    user: "0:0"
    env_file:
      - ${QNAP_PROJECT_ROOT:-/share/Container/qnap-monitoring}/.env
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-39090}:9090"
    volumes:
      - ${QNAP_PROJECT_ROOT:-/share/Container/qnap-monitoring}/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${QNAP_DATA_ROOT:-/share/Container/qnap-monitoring}/prometheus-data:/prometheus
    networks:
      - monitoring

  qnap-dashboard-builder:
    <<: *qnap-image
    container_name: qnap-dashboard-builder
    entrypoint:
      - python3
      - /opt/qnap/scripts/qnap-dashboard-builder.py
    environment:
      QNAP_DASHBOARD_TEMPLATE: /opt/qnap/templates/qnap-cn-base.json
      QNAP_DASHBOARD_OUTPUT: /runtime/qnap-cn.json
      QNAP_DASHBOARD_STATE: /runtime/.pcie-layout-state.json
    volumes:
      - ${QNAP_DATA_ROOT:-/share/Container/qnap-monitoring}/dashboard-runtime:/runtime
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import json; json.load(open('/runtime/qnap-cn.json', encoding='utf-8'))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  grafana:
    image: grafana/grafana:13.1.1
    container_name: qnap-grafana
    restart: unless-stopped
    user: "0:0"
    env_file:
      - ${QNAP_PROJECT_ROOT:-/share/Container/qnap-monitoring}/.env
    environment:
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/qnap-cn.json
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: grafana-postgres:5432
      GF_DATABASE_SSL_MODE: disable
    ports:
      - "${GRAFANA_PORT:-3300}:3000"
    volumes:
      - ${QNAP_DATA_ROOT:-/share/Container/qnap-monitoring}/grafana-data:/var/lib/grafana
      - ${QNAP_DATA_ROOT:-/share/Container/qnap-monitoring}/dashboard-runtime:/var/lib/grafana/dashboards:ro
      - ${QNAP_PROJECT_ROOT:-/share/Container/qnap-monitoring}/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      grafana-postgres:
        condition: service_healthy
    networks:
      - monitoring

networks:
  monitoring:
    name: qnap_monitoring_net
    driver: bridge
