# 视频观众 GPU 版：无需上传 qnap.env；PCIe/GPU 采集需要特权模式。
services:
  qnap-monitor:
    image: ydxian/qnap-monitor-one:latest
    container_name: qnap-monitor-one
    restart: unless-stopped
    user: "0:0"
    privileged: true
    environment:
      NAS_IP: "192.168.1.100"
      QNAP_HOSTNAME: "QNAP-NAS"
      SNMP_COMMUNITY: "public"
      GF_SECURITY_ADMIN_PASSWORD: "请改成强密码"
      GF_SECURITY_ADMIN_USER: "admin"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_DEFAULT_LANGUAGE: "zh-Hans"
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: "Asia/Shanghai"
      TZ: "Asia/Shanghai"
      PROMETHEUS_RETENTION: "30d"
      QNAP_SHARE_SCAN_INTERVAL: "3600"
      QNAP_GPU_ENABLED: "true"
      QNAP_PCIE_INCLUDE_BDFS: ""
      QNAP_PCIE_EXCLUDE_BDFS: ""
    ports:
      - "3300:3000"
    volumes:
      - /share:/share:ro
      - /proc:/host-proc:ro
      - /sys:/host-sys:ro
      - /etc/config:/host-etc-config:ro
      - /share/Container/qnap-monitor-one/data:/data
