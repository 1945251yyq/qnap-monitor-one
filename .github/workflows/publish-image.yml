name: Publish validated multi-architecture image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate project
        run: |
          chmod +x scripts/*.sh exporter/scripts/*.sh pcie-exporter/*.sh
          ./scripts/validate-project.sh

      - name: Validate Compose
        run: |
          cp .env.example .env
          QNAP_PROJECT_ROOT="${GITHUB_WORKSPACE}" \
          QNAP_DATA_ROOT="${RUNNER_TEMP}/qnap-monitoring" \
            docker compose config --quiet
          rm -f .env

      - name: Run complete stack smoke test
        run: ./scripts/smoke-test.sh

  publish:
    needs:
      - validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/qnap-monitor-one
            ${{ secrets.DOCKERHUB_USERNAME }}/qnap-monitor-one
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published manifests
        run: |
          docker buildx imagetools inspect \
            "${{ secrets.DOCKERHUB_USERNAME }}/qnap-monitor-one:${{ github.ref == 'refs/heads/main' && 'latest' || steps.meta.outputs.version }}"
