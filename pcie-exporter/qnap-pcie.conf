[agent]
  interval = "30s"
  round_interval = true
  metric_batch_size = 5000
  metric_buffer_limit = 30000
  collection_jitter = "0s"
  flush_interval = "30s"
  flush_jitter = "1s"
  hostname = "${QNAP_HOSTNAME}"
  omit_hostname = false
  skip_processors_after_aggregators = false

[[outputs.prometheus_client]]
  listen = ":9275"
  expiration_interval = "75s"

# PCIe 清单与运行状态：标准 sysfs 为主，QNAP NVIDIA 驱动工具为可选增强。
[[inputs.exec]]
  commands = [["/bin/sh", "/opt/qnap/scripts/qnap-pcie-collect.sh"]]
  timeout = "25s"
  interval = "30s"
  data_format = "influx"
