[agent]
  interval = "60s"
  round_interval = true
  metric_batch_size = 5000
  metric_buffer_limit = 20000
  collection_jitter = "0s"
  flush_interval = "60s"
  flush_jitter = "1s"
  hostname = "${QNAP_HOSTNAME}"
  omit_hostname = false
  snmp_translator = "gosmi"

[[outputs.prometheus_client]]
  listen = ":9273"
  expiration_interval = "0s"

# ========================================================
# 系统基础指标
# 单独使用 name_override，避免覆盖下面各表的测量名称。
# ========================================================
[[inputs.snmp]]
  name_override = "qnap_system"
  agent_host_tag = "source"
  agents = ["udp://${NAS_IP}:161"]
  community = "${SNMP_COMMUNITY}"
  version = 2
  timeout = "20s"
  retries = 1

  [[inputs.snmp.field]]
    name = "cpu_usage"
    oid = "1.3.6.1.4.1.24681.1.3.1.0"


  [[inputs.snmp.field]]
    name = "uptime_seconds"
    oid = "1.3.6.1.4.1.24681.1.3.4.0"
    conversion = "float(2)"

  [[inputs.snmp.field]]
    name = "cpu_temperature_celsius"
    oid = "1.3.6.1.4.1.24681.1.3.5.0"

  [[inputs.snmp.field]]
    name = "system_temperature_celsius"
    oid = "1.3.6.1.4.1.24681.1.3.6.0"

  [[inputs.snmp.field]]
    name = "model"
    oid = "1.3.6.1.4.1.24681.1.3.12.0"
    is_tag = true

  [[inputs.snmp.field]]
    name = "nas_hostname"
    oid = "1.3.6.1.4.1.24681.1.3.13.0"
    is_tag = true

# ========================================================
# QNAP 表格指标
# 不设置 name_override，各表使用自己的 name：
# qnap_disk、qnap_fan、qnap_network。
# ========================================================
[[inputs.snmp]]
  agent_host_tag = "source"
  agents = ["udp://${NAS_IP}:161"]
  community = "${SNMP_COMMUNITY}"
  version = 2
  timeout = "30s"
  retries = 1

  # ---------------- 硬盘：QNAP NAS-MIB 扩展表 ----------------
  # 与当前已正常返回 CPU 和温度的 1.3.6.1.4.1.24681.1.3
  # 属于同一套 QNAP 扩展 MIB，兼容性高于部分固件未开放的 55062 分支。
  # 表：systemHdTableEX = 1.3.6.1.4.1.24681.1.3.11
  [[inputs.snmp.table]]
    name = "qnap_disk"
    oid = "1.3.6.1.4.1.24681.1.3.11"
    index_as_tag = true

    # 硬盘槽位/索引
    [[inputs.snmp.table.field]]
      name = "disk_id"
      oid = "1.3.6.1.4.1.24681.1.3.11.1.1"
      is_tag = true

    # 硬盘描述
    [[inputs.snmp.table.field]]
      name = "disk_description"
      oid = "1.3.6.1.4.1.24681.1.3.11.1.2"
      is_tag = true

    # 硬盘温度，单位摄氏度
    [[inputs.snmp.table.field]]
      name = "temperature_celsius"
      oid = "1.3.6.1.4.1.24681.1.3.11.1.3"

    # 硬盘型号仅作为温度曲线图例标签。
    [[inputs.snmp.table.field]]
      name = "disk_model"
      oid = "1.3.6.1.4.1.24681.1.3.11.1.5"
      is_tag = true

  # ---------------- 风扇：NAS-MIB EX ----------------
  [[inputs.snmp.table]]
    name = "qnap_fan"
    oid = "1.3.6.1.4.1.24681.1.3.15"
    index_as_tag = true

    [[inputs.snmp.table.field]]
      name = "fan_id"
      oid = "1.3.6.1.4.1.24681.1.3.15.1.1"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "fan_name"
      oid = "1.3.6.1.4.1.24681.1.3.15.1.2"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "speed_rpm"
      oid = "1.3.6.1.4.1.24681.1.3.15.1.3"

  # ---------------- 网络接口：标准 IF-MIB 64 位计数 ----------------
  [[inputs.snmp.table]]
    name = "qnap_network"
    oid = "1.3.6.1.2.1.31.1.1"
    index_as_tag = true

    [[inputs.snmp.table.field]]
      name = "interface"
      oid = "1.3.6.1.2.1.31.1.1.1.1"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "in_octets"
      oid = "1.3.6.1.2.1.31.1.1.1.6"

    [[inputs.snmp.table.field]]
      name = "out_octets"
      oid = "1.3.6.1.2.1.31.1.1.1.10"

    [[inputs.snmp.table.field]]
      name = "speed_mbps"
      oid = "1.3.6.1.2.1.31.1.1.1.15"

    [[inputs.snmp.table.field]]
      name = "interface_alias"
      oid = "1.3.6.1.2.1.31.1.1.1.18"
      is_tag = true

