[agent]
  interval = "30s"
  round_interval = true
  metric_batch_size = 5000
  metric_buffer_limit = 30000
  collection_jitter = "0s"
  flush_interval = "30s"
  flush_jitter = "1s"
  hostname = "${QNAP_HOSTNAME}"
  omit_hostname = false
  skip_processors_after_aggregators = false

[[outputs.prometheus_client]]
  listen = ":9274"
  expiration_interval = "2m"

# 宿主机内存：自动识别 QTS / QuTS hero，并动态计算。
[[inputs.exec]]
  commands = [["/bin/sh", "/opt/qnap/scripts/qnap-host-memory.sh"]]
  timeout = "5s"
  interval = "30s"
  data_format = "influx"

# 数据卷总容量：自动识别 QTS / QuTS hero 主数据卷。
[[inputs.exec]]
  commands = [["/bin/sh", "/opt/qnap/scripts/qnap-host-disk.sh"]]
  timeout = "10s"
  interval = "60s"
  data_format = "influx"

# 共享文件夹：后台深度扫描，Telegraf 仅快速读取持久化缓存。
[[inputs.exec]]
  commands = [["/bin/sh", "/opt/qnap/scripts/qnap-read-shared-cache.sh"]]
  timeout = "5s"
  interval = "30s"
  data_format = "influx"

# 物理硬盘清单：读取启动时生成、每天更新一次的持久化缓存。
[[inputs.exec]]
  commands = [["/bin/sh", "/opt/qnap/scripts/qnap-read-disk-cache.sh"]]
  timeout = "5s"
  interval = "30s"
  data_format = "influx"

# 物理网络接口：直接读取宿主机 /sys 与 /proc，只输出硬件网卡。
[[inputs.exec]]
  commands = [["/bin/sh", "/opt/qnap/scripts/qnap-host-network.sh"]]
  timeout = "5s"
  interval = "30s"
  data_format = "influx"
