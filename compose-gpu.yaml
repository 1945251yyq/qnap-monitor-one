# 配置文件 GPU/PCIe 版：必须先上传 /share/Container/qnap-monitor-one/qnap.env。
services:
  qnap-monitor:
    image: ydxian/qnap-monitor-one:latest
    container_name: qnap-monitor-one
    restart: unless-stopped
    user: "0:0"
    privileged: true
    env_file:
      - /share/Container/qnap-monitor-one/qnap.env
    environment:
      QNAP_GPU_ENABLED: "true"
    ports:
      - "3300:3000"
    volumes:
      - /share:/share:ro
      - /proc:/host-proc:ro
      - /sys:/host-sys:ro
      - /etc/config:/host-etc-config:ro
      - /share/Container/qnap-monitor-one/data:/data
