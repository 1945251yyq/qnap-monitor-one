<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>QNAP Status Lite</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header>
    <div><span class="brand">QNAP</span><strong>Status Lite</strong></div>
    <div class="head-actions"><span id="updated">正在连接…</span><button id="kiosk">全屏</button></div>
  </header>
  <main>
    <section class="hero">
      <div><p class="eyebrow">设备状态</p><h1 id="hostname">QNAP NAS</h1><p id="identity">正在读取设备信息</p></div>
      <div id="health" class="health waiting">采集中</div>
    </section>
    <section id="summary" class="summary"></section>
    <div class="history-toolbar"><h2>运行趋势</h2><select id="historyRange"><option value="1">1 小时</option><option value="6">6 小时</option><option value="24" selected>24 小时</option><option value="168">7 天</option></select></div>
    <section class="grid">
      <article><div class="title"><h2>CPU 与内存</h2></div><canvas id="usageTrend"></canvas><div id="usageStats" class="chart-stats"></div></article>
      <article><div class="title"><h2>设备温度</h2></div><canvas id="temperatureTrend"></canvas><div id="temperatureStats" class="chart-stats"></div></article>
      <article><div class="title"><h2>风扇转速</h2></div><canvas id="fanTrend"></canvas><div id="fanStats" class="chart-stats"></div></article>
      <article><div class="title"><h2>网络吞吐</h2></div><canvas id="networkTrend"></canvas><div id="networkStats" class="chart-stats"></div></article>
      <article class="wide"><div class="title"><h2>共享文件夹</h2><small>按真实目录统计，嵌套共享不会重复计入总占用</small></div><div id="shares" class="table-wrap"></div></article>
      <article><div class="title"><h2>风扇当前状态</h2></div><div id="fans" class="cards"></div></article>
      <article><div class="title"><h2>物理网络接口</h2></div><div id="networks" class="stack"></div></article>
      <article class="wide"><div class="title"><h2>硬盘与 SMART</h2></div><div id="disks" class="table-wrap"></div></article>
      <article><div class="title"><h2>PCIe / GPU</h2></div><div id="pcie" class="stack"></div></article>
      <article><div class="title"><h2>采集器状态</h2></div><div id="collectorStatus" class="stack"></div></article>
      <article class="wide"><div class="title"><h2>高占用进程</h2></div><div id="processes" class="table-wrap"></div></article>
      <article class="wide diagnostic"><details><summary>内部存储数据集（诊断信息）</summary><div id="volumes" class="table-wrap"></div></details></article>
    </section>
  </main>
  <footer>QNAP Status Lite · 单容器、单进程、本地存储</footer>
  <script src="/app.js" defer></script>
</body>
</html>
