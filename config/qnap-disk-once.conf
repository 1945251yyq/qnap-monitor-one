[agent]
  interval = "1s"
  round_interval = false
  flush_interval = "1s"
  hostname = "${QNAP_HOSTNAME}"
  omit_hostname = false

[[inputs.snmp]]
  agent_host_tag = "source"
  agents = ["udp://${NAS_IP}:161"]
  community = "${SNMP_COMMUNITY}"
  version = 2
  timeout = "30s"
  retries = 1

  # 不设置父表 oid。部分 QTS / QuTS hero 固件不会把
  # 1.3.6.1.4.1.24681.1.3.11 作为可直接展开的 SNMP table 返回。
  # Telegraf 改为分别 walk 下列字段列，再按相同索引合并成硬盘行。
  [[inputs.snmp.table]]
    name = "qnap_disk_inventory"
    index_as_tag = true

    [[inputs.snmp.table.field]]
      name = "disk_id"
      oid = "1.3.6.1.4.1.24681.1.3.11.1.1"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "status"
      oid = "1.3.6.1.4.1.24681.1.3.11.1.4"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "disk_model"
      oid = "1.3.6.1.4.1.24681.1.3.11.1.5"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "capacity_bytes"
      oid = "1.3.6.1.4.1.24681.1.3.11.1.6"

[[outputs.file]]
  files = ["stdout"]
  data_format = "influx"
  influx_sort_fields = true

